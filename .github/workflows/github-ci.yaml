name: CI

on:
  push:
  pull_request:

jobs:

  push-images:
    needs: [lints, tests, type-checks]
    name: Push images
    runs-on: ubuntu-latest
    steps:
       - name: Echo Implementation
         run: echo Pushing docker container should be implemented using Harbor or other solutions.

  type-checks:
    name: Run Type Checkers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Compose 
        uses: docker/setup-compose-action@latest
        with:
          version: "latest"
      
      - name: Build Docker Images
        runs: make ci-build

      - name: Up Docker Containers
        runs: make ci-up
        env:
          DEBUG: ${DEBUG}
          LOG_LEVEL: ${LOG_LEVEL}
          BOT_TOKEN: ${BOT_TOKEN}
          DATABASE_USER: ${DATABASE_USER}
          DATABASE_PASSWORD: ${DATABASE_PASSWORD}
          DATABASE_HOST: ${DATABASE_HOST}
          DATABASE_PORT: ${DATABASE_PORT}
          DATABASE_NAME: ${DATABASE_NAME}
          REDIS_HOST: ${REDIS_HOST}
          REDIS_PORT: ${REDIS_PORT}
          REDIS_PASSWORD: ${REDIS_PASSWORD}
          REDIS_DB: ${REDIS_DB}

      - name: Run Tests
        runs: make ci-test-q

