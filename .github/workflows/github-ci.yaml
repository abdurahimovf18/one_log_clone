name: CI

on:
  push:
  pull_request:

jobs:
  push-images:
    needs: [lints, tests, type-checks]
    name: Push images
    runs-on: ubuntu-latest
    steps:
       - name: Echo Implementation
         run: echo Pushing docker container should be implemented using Harbor or other solutions.

  type-checks:
    name: Run Type Checkers
    runs-on: ubuntu-latest
    steps:
      - name: Setup CI Docker Compose
        uses: ./.github/actions/setup-ci-compose 

      - name: Run Tests
        run: make ci-test

  linters:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Setup CI Docker Compose
        uses: ./.github/actions/setup-ci-compose 

      - name: Run Tests
        run: make ci-lint
    
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Setup CI Docker Compose
        uses: ./.github/actions/setup-ci-compose 

      - name: Run Tests
        run: make ci-test
