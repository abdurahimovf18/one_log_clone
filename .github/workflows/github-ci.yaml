name: CI

on:
  push:
  pull_request:

jobs:
  push-images:
    needs: [lints, tests, type-checks]
    name: Build and Push Images
    runs-on: ubuntu-latest
    fail-fast: true
    steps:
       - name: Echo Implementation
         run: echo "TODO: Push Images to Habor or DockerHUB later."

  type-checks:
    name: Type Checks
    runs-on: ubuntu-latest
    fail-fast: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - id: "setup_docker_compose"
        name: "Setup Docker Compose"
        uses: ./.github/actions/setup-ci-compose
        with: &ci-compose-vars  # ci-compose-vars is being used by other runs in this github workflow
          DEBUG: ${{ secrets.DEBUG }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ secrets.REDIS_DB }}

      - name: Run Tests
        run: make ci-type-check

  lints:
    name: Linters
    runs-on: ubuntu-latest
    fail-fast: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - id: "setup_docker_compose"
        name: "Setup Docker Compose"
        uses: ./.github/actions/setup-ci-compose
        with: *ci-compose-vars

      - name: Run Linters
        run: make ci-lint
    
  tests:
    name: Tests
    runs-on: ubuntu-latest
    fail-fast: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - id: "setup_docker_compose"
        name: "Setup Docker Compose"
        uses: ./.github/actions/setup-ci-compose
        with: *ci-compose-vars

      - name: Run Tests
        run: make ci-test
