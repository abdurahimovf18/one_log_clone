name: CI

on:
  push:
  pull_request:

ci-compose-vars: &ci-compose-vars
  DEBUG: ${{ secrets.DEBUG }}
  LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  DATABASE_USER: ${{ secrets.DATABASE_USER }}
  DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
  DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
  DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
  DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
  REDIS_DB: ${{ secrets.REDIS_DB }}

jobs:
  push-images:
    needs: [lints, tests, type-checks]
    name: Push images
    runs-on: ubuntu-latest
    steps:
       - name: Echo Implementation
         run: echo Pushing docker container should be implemented using Harbor or other solutions.

  type-checks:
    name: Run Type Checkers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - id: "setup_docker_compose"
        name: "Setup Docker Compose"
        uses: ./.github/actions/setup-ci-compose
        with: *ci-compose-vars

      - name: Run Tests
        run: make ci-test

  lints:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - id: "setup_docker_compose"
        name: "Setup Docker Compose"
        uses: ./.github/actions/setup-ci-compose
        with:
          DEBUG: ${{ secrets.DEBUG }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ secrets.REDIS_DB }}

      - name: Run Tests
        run: make ci-lint
    
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - id: "setup_docker_compose"
        name: "Setup Docker Compose"
        uses: ./.github/actions/setup-ci-compose
        with:
          DEBUG: ${{ secrets.DEBUG }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ secrets.REDIS_DB }}

      - name: Run Tests
        run: make ci-test
